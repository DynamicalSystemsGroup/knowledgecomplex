site_name: knowledgecomplex
site_url: https://dynamicalsystemsgroup.github.io/knowledgecomplex
repo_url: https://github.com/dynamicalsystemsgroup/knowledgecomplex
repo_name: dynamicalsystemsgroup/knowledgecomplex

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            members_order: source

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Ontology: ontology.md
  - API Reference:
      - Schema: api/schema.md
      - Graph: api/graph.md
      - Visualization: api/viz.md
      - Algebraic Topology: api/analysis.md
      - Clique Inference: api/clique.md
      - Filtrations: api/filtration.md
      - Parametric Sequences: api/parametric.md
      - Diffs & Sequences: api/diff.md
      - File I/O: api/io.md
      - Codecs: api/codecs.md
      - Exceptions: api/exceptions.md
